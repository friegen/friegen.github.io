<!DOCTYPE html>
<!--
  ページの枠。標準のデザイン（Primer）の枠は、上部とタブの題名に GitHub のプロフィールの名前を出すため、
  名前を出さない自前の枠にしている。見た目（CSS）は標準のものをそのまま使う。
-->
<html lang="{{ page.lang | default: 'ja' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Google Search Console の所有権の確認（消すと確認が外れる） -->
  <meta name="google-site-verification" content="a8SLpt_z_TZEy713gi_N8C0ski4Bc2rlwTU8j1c1zg8" />
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
</head>
<body>
  <div class="container-lg px-3 my-5 markdown-body">
    {{ content }}
  </div>
</body>
</html>
