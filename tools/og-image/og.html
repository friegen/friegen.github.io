<!DOCTYPE html>
<!--
  トップページの og:image（SNS で共有したときに出る画像、1200×630）の元。公開はしない（_config.yml の exclude）。
  作り直し方: このフォルダで node render.js → ../../assets/og.jpg ができる
  大事なものは真ん中に置く（SNS によっては左右や上下を切って表示するため）
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=Noto+Sans+JP:wght@600;800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden; background: #f6f8fc; color: #15191e;
    font-family: "Inter", "Noto Sans JP", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .aurora i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; }
  .aurora i:nth-child(1) { background: #9cc5f7; width: 620px; height: 620px; top: -300px; left: -180px; }
  .aurora i:nth-child(2) { background: #f3b6d9; width: 560px; height: 560px; top: -120px; right: -220px; }
  .aurora i:nth-child(3) { background: #fde59a; width: 600px; height: 600px; bottom: -380px; left: 300px; }
  .aurora i:nth-child(4) { background: #b8f0c8; width: 420px; height: 420px; bottom: -200px; right: -120px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: linear-gradient(90deg, #4f8df5, #c86fd0 30%, #f39a6b 55%, #f6d365 78%, #7bd88f); }

  .logo { position: relative; display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 800; }
  .logo-mark { width: 46px; height: 46px; border-radius: 13px; background: linear-gradient(135deg, #4f8df5, #c86fd0 55%, #f39a6b); display: grid; place-items: center; color: #fff; font-size: 26px; }
  .logo .en { color: #5d636b; font-weight: 600; }

  h1 { position: relative; margin-top: 30px; font-size: 92px; line-height: 1.18; font-weight: 800; letter-spacing: -0.01em; }
  .grad { background: linear-gradient(90deg, #4f8df5, #c86fd0 45%, #f39a6b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { position: relative; margin-top: 18px; font-size: 30px; font-weight: 600; color: #5d636b; }

  .apps { position: relative; display: flex; gap: 20px; margin-top: 38px; }
  .app { display: flex; align-items: center; gap: 14px; padding: 12px 26px 12px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(20, 40, 70, 0.10); box-shadow: 0 10px 30px rgba(18, 44, 84, 0.12); font-size: 26px; font-weight: 800; }
  .app img { width: 56px; height: 56px; border-radius: 15px; }
</style>
</head>
<body>
  <div class="aurora"><i></i><i></i><i></i><i></i></div>
  <div class="logo"><span class="logo-mark">す</span>すとれん <span class="en">/ stren</span></div>
  <h1>毎日を、<br><span class="grad">ちょっと便利に。</span></h1>
  <p class="sub">Small apps for everyday life.</p>
  <div class="apps">
    <div class="app"><img src="../../assets/apps/irodori-notes.png" width="56" height="56" alt="">いろどりメモ</div>
    <div class="app"><img src="../../assets/apps/kataomoi-bluesky.png" width="56" height="56" alt="">片思いチェッカー for Bluesky</div>
  </div>
  <div class="bar"></div>
</body>
</html>
